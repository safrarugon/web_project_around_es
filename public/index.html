<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <meta content="ie=edge" http-equiv="X-UA-Compatible" />
    <title>Around The U.S.</title>
    <link href="./pages/index.css" rel="stylesheet" />
  </head>
  <body class="page">
    <div class="page__content">
      <header class="header page__section">
        <img
          alt="Logotipo Around The U.S."
          class="logo header__logo"
          src="./images/logo.svg"
        />
      </header>
      <main class="content">
        <!--Seccion del Perfil-->
        <section class="profile page__section">
          <!--Imagen de Perfil-->
          <img class="profile__image" src="./images/avatar.jpg" alt="Avatar" />
          <!--Información del Perfil-->
          <div class="profile__info">
            <!--Titulo del Perfil-->
            <h1 class="profile__title">Jacques Cousteau</h1>
            <!--Botón de editar Perfil-->
            <button
              aria-label="Editar perfil"
              class="profile__edit-button"
              type="button"
            ></button>
            <p class="profile__description">Explorador</p>
          </div>
          <!--Botón new card-->
          <button
            aria-label="Agregar tarjeta"
            class="profile__add-button"
            type="button"
          ></button>
        </section>
        <!--Sección de Cards-->
        <section class="cards page__section">
          <!--Listado de cards-->
          <ul class="cards__list">
            <!--Template de cards-->
            <template id="card-template">
              <li class="card">
                <!--Imagen del card-->
                <img class="card__image" src="" alt="" />
                <!--Botón eliminar card-->
                <button
                  aria-label="Eliminar tarjeta"
                  class="card__delete-button"
                  type="button"
                ></button>
                <!--Descripción del card-->
                <div class="card__description">
                  <h2 class="card__title"></h2>
                  <!--Botón Me gusta-->
                  <button
                    aria-label="Botón Me gusta"
                    class="card__like-button"
                    type="button"
                  ></button>
                </div>
              </li>
            </template>
          </ul>
        </section>
      </main>
      <!--Pie de pagína-->
      <footer class="footer page__section">
        <p class="footer__copyright">© 2025 Around The U.S.</p>
      </footer>
      <!--Inician Modales-->
      <!--Modal de edición de Perfil-->
      <div class="popup" id="edit-popup">
        <div class="popup__content">
          <!--Botón de cierre de Modal-->
          <button
            aria-label="Cerrar ventana emergente"
            class="popup__close"
            type="button"
          ></button>
          <!--Titulo de Modal-->
          <h3 class="popup__title">Editar perfil</h3>
          <!--Formulario de Perfil-->
          <form class="popup__form" id="edit-profile-form">
            <!--Input Nombre de perfil-->
            <input
              class="popup__input popup__input_type_name"
              name="name"
              minlength="2"
              maxlength="40"
              placeholder="Nombre"
              type="text"
              required
            />
            <!--Mensaje de error al validar el input-->
            <span class="popup__input-error name-error"></span>
            <!--Input Descripción de perfil-->
            <input
              class="popup__input popup__input_type_description"
              name="description"
              minlength="2"
              maxlength="200"
              placeholder="Acerca de mí"
              type="text"
              required
            />
            <!--Mensaje de error al validar el input-->
            <span class="popup__input-error description-error"></span>
            <!--Botón de Guardar-->
            <button disabled class="button popup__button" type="submit">
              Guardar
            </button>
          </form>
        </div>
      </div>
      <!--Modal de new card-->
      <div class="popup" id="new-card-popup">
        <div class="popup__content">
          <!--Botón de cierre de Modal-->
          <button
            aria-label="Cerrar ventana emergente"
            class="popup__close"
            type="button"
          ></button>
          <!--Titulo de Modal-->
          <h3 class="popup__title">Nuevo lugar</h3>
          <!--Formulario de New card-->
          <form class="popup__form" id="new-card-form">
            <!--Input Nombre del card-->
            <input
              class="popup__input popup__input_type_card-name"
              name="place-name"
              placeholder="Título"
              required
              type="text"
              minlength="2"
              maxlength="30"
            />
            <!--Mensaje de error al validar el input-->
            <span class="popup__input-error place-name-error"></span>
            <!--Input Link de imagen-->
            <input
              class="popup__input popup__input_type_url"
              name="link"
              placeholder="Enlace a la imagen"
              required
              type="url"
            />
            <!--Mensaje de error al validar el input-->
            <span class="popup__input-error link-error"></span>
            <!--Botón de Crear-->
            <button disabled class="button popup__button" type="submit">
              Crear
            </button>
          </form>
        </div>
      </div>
      <!--Modal de Imagen-->
      <div class="popup" id="image-popup">
        <div class="popup__content popup__content_content_image">
          <!--Botón de cierre de Modal-->
          <button
            aria-label="Cerrar ventana emergente"
            class="popup__close"
            type="button"
          ></button>
          <!--Imagen del Card-->
          <img alt="" class="popup__image" src="#" />
          <!--Descripcion de imagen-->
          <p class="popup__caption"></p>
        </div>
      </div>
    </div>
    <!--Scripts de JS-->
    <script type="module" src="./scripts/index.js"></script>
  </body>
</html>
